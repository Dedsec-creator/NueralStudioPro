<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="110" fill="none" stroke="#1e293b" stroke-width="6" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" />

  <!-- Outer Tuning Meter Arc -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="12" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#dialGrad)" stroke-width="12" stroke-dasharray="320 700" stroke-linecap="round" filter="url(#glow)" />

  <!-- Inner Console Plate -->
  <circle cx="256" cy="256" r="120" fill="#0f172a" stroke="#334155" stroke-width="4" />

  <!-- Frequency Pitch Bars / Vocal Wave Spectrum -->
  <g transform="translate(256, 256)">
    <!-- Central Vocal Mic & Pitch Wave -->
    <path d="M-60,0 C-40,-35 -20,-50 0,-15 C20,20 40,45 60,0" fill="none" stroke="url(#dialGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
    <path d="M-40,25 C-20,45 0,10 20,-30 C35,-15 50,15 65,5" fill="none" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.7" stroke-linecap="round" />
    
    <!-- Microphone Capsule Silhouette -->
    <rect x="-24" y="-75" width="48" height="70" rx="24" fill="none" stroke="#f8fafc" stroke-width="7" />
    <line x1="-24" y1="-42" x2="24" y2="-42" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
    <path d="M-36,-35 C-36,15 36,15 36,-35" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="0" y1="15" x2="0" y2="55" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
    <line x1="-28" y1="55" x2="28" y2="55" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />

    <!-- Pitch Lock Indicator Dot -->
    <circle cx="0" cy="-42" r="6" fill="#10b981" filter="url(#glow)" />
  </g>

  <!-- Brand Accents -->
  <circle cx="256" cy="74" r="8" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="100" cy="256" r="5" fill="#3b82f6" />
  <circle cx="412" cy="256" r="5" fill="#8b5cf6" />
  <circle cx="256" cy="438" r="6" fill="#ec4899" />
</svg>
